<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Machine Learning Learning Roadmap</title>
  <desc id="desc">Flowchart from foundations to deployment and iterative improvement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <style>
      .title{font:700 44px Inter,Segoe UI,Arial,sans-serif;fill:#e2e8f0}
      .subtitle{font:400 22px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}
      .box{fill:#1d4ed8;stroke:#93c5fd;stroke-width:2;rx:16}
      .box2{fill:#0f766e;stroke:#5eead4;stroke-width:2;rx:16}
      .box3{fill:#7c3aed;stroke:#c4b5fd;stroke-width:2;rx:16}
      .txt{font:600 24px Inter,Segoe UI,Arial,sans-serif;fill:white}
      .small{font:400 18px Inter,Segoe UI,Arial,sans-serif;fill:#e2e8f0}
      .arrow{stroke:#94a3b8;stroke-width:4;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="70" text-anchor="middle" class="title">Machine Learning From Scratch</text>
  <text x="600" y="108" text-anchor="middle" class="subtitle">A practical loop: learn, build, evaluate, deploy, improve</text>

  <rect x="80" y="180" width="220" height="120" class="box"/>
  <text x="190" y="230" text-anchor="middle" class="txt">1. Foundations</text>
  <text x="190" y="260" text-anchor="middle" class="small">Math + Python + Data</text>

  <rect x="360" y="180" width="220" height="120" class="box"/>
  <text x="470" y="230" text-anchor="middle" class="txt">2. Core ML</text>
  <text x="470" y="260" text-anchor="middle" class="small">Regression, Trees, Metrics</text>

  <rect x="640" y="180" width="220" height="120" class="box2"/>
  <text x="750" y="230" text-anchor="middle" class="txt">3. Deep Learning</text>
  <text x="750" y="260" text-anchor="middle" class="small">NNs, CNNs, Transformers</text>

  <rect x="920" y="180" width="220" height="120" class="box2"/>
  <text x="1030" y="230" text-anchor="middle" class="txt">4. Projects</text>
  <text x="1030" y="260" text-anchor="middle" class="small">Portfolio + Case Studies</text>

  <rect x="250" y="430" width="280" height="120" class="box3"/>
  <text x="390" y="480" text-anchor="middle" class="txt">5. Deployment</text>
  <text x="390" y="510" text-anchor="middle" class="small">API, Monitoring, Retraining</text>

  <rect x="680" y="430" width="280" height="120" class="box3"/>
  <text x="820" y="480" text-anchor="middle" class="txt">6. Iterate</text>
  <text x="820" y="510" text-anchor="middle" class="small">Error analysis + experiments</text>

  <line x1="300" y1="240" x2="360" y2="240" class="arrow"/>
  <line x1="580" y1="240" x2="640" y2="240" class="arrow"/>
  <line x1="860" y1="240" x2="920" y2="240" class="arrow"/>
  <line x1="1030" y1="300" x2="900" y2="430" class="arrow"/>
  <line x1="680" y1="490" x2="530" y2="490" class="arrow"/>
  <line x1="250" y1="490" x2="140" y2="300" class="arrow"/>

  <text x="600" y="650" text-anchor="middle" class="subtitle">Start simple, ship often, and learn from every model error.</text>
</svg>
